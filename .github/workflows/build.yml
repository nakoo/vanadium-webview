name: Build Vanadium WebView Module

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '26 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Vanadium & Extract Signature
        run: |
          mkdir -p apks
          
          echo "=== Downloading Vanadium WebView & Library ==="
          curl -L -o apks/TrichromeWebView.apk \
            "https://gitlab.com/grapheneos/platform_external_vanadium/-/raw/17/prebuilt/arm64/TrichromeWebView.apk"

          curl -L -o apks/TrichromeLibrary.apk \
            "https://gitlab.com/grapheneos/platform_external_vanadium/-/raw/17/prebuilt/arm64/TrichromeLibrary.apk"

          echo "=== Extracting X.509 signature ==="
          VANADIUM_SIG=$(keytool -printcert -jarfile apks/TrichromeWebView.apk -rfc \
            | awk '/BEGIN CERTIFICATE/{flag=1; next} /END CERTIFICATE/{exit} flag' \
            | tr -d '\r\n')

          if [ -z "$VANADIUM_SIG" ]; then
            echo "Error: Failed to extract signature"
            exit 1
          fi

          mkdir -p overlay_src/res/xml
          sed "s|@VANADIUM_SIGNATURE@|$VANADIUM_SIG|g" \
            templates/config_webview_packages.xml.template \
            > overlay_src/res/xml/config_webview_packages.xml

      - name: Compile and Sign Overlay APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          ANDROID_JAR=$(ls -d $ANDROID_HOME/platforms/android-34/android.jar || ls -d $ANDROID_HOME/platforms/android-*/android.jar | tail -n 1)

          # 1. Compile resources
          $BUILD_TOOLS/aapt2 compile --dir overlay_src/res -o compiled_res.zip

          # 2. Link APK
          $BUILD_TOOLS/aapt2 link -I "$ANDROID_JAR" \
            --manifest overlay_src/AndroidManifest.xml \
            compiled_res.zip \
            -o unaligned.apk

          # 3. Align APK
          $BUILD_TOOLS/zipalign -p -f 4 unaligned.apk aligned.apk

          # 4. Generate keystore & Sign
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug"

          mkdir -p overlay
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out overlay/CustomWebViewOverlay.apk \
            aligned.apk

      - name: Clean Build Workspace
        run: |
          rm -rf overlay_src templates unaligned.apk aligned.apk compiled_res.zip debug.keystore

      - name: Auto-generate Version Metadata and update.json
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          VANADIUM_VER_NAME=$($BUILD_TOOLS/aapt dump badging apks/TrichromeWebView.apk | awk -F"versionName='" '{print $2}' | cut -d"'" -f1)
          VANADIUM_VER_CODE=$($BUILD_TOOLS/aapt dump badging apks/TrichromeWebView.apk | awk -F"versionCode='" '{print $2}' | cut -d"'" -f1)

          echo "Detected Vanadium: $VANADIUM_VER_NAME (code: $VANADIUM_VER_CODE)"

          # Update module.prop for the flashable zip
          sed -i "s/^version=.*/version=$VANADIUM_VER_NAME/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$VANADIUM_VER_CODE/" module.prop

          # Generate updated update.json pointing to the raw CHANGELOG.md
          cat <<EOF > update.json
          {
            "version": "$VANADIUM_VER_NAME",
            "versionCode": $VANADIUM_VER_CODE,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/latest/download/vanadium-webview-module.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          EOF

          # Generate release notes for this specific version
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          cat <<EOF > release_notes.md
          ## [$VANADIUM_VER_NAME] - $RELEASE_DATE
          - Updated Vanadium WebView to **$VANADIUM_VER_NAME** (versionCode: \`$VANADIUM_VER_CODE\`).
          - Upstream prebuilt from [GrapheneOS Vanadium](https://gitlab.com/grapheneos/platform_external_vanadium).
          EOF

          # Prepend to cumulative CHANGELOG.md only if this version is not already recorded
          touch CHANGELOG.md
          if ! grep -q "## \[$VANADIUM_VER_NAME\]" CHANGELOG.md; then
            cat release_notes.md <(echo "") CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          fi

          echo "VANADIUM_VER_NAME=$VANADIUM_VER_NAME" >> $GITHUB_ENV
          echo "VANADIUM_VER_CODE=$VANADIUM_VER_CODE" >> $GITHUB_ENV

      - name: Create Flashable Zip
        run: |
          zip -r9 vanadium-webview-module.zip \
            module.prop \
            customize.sh \
            service.sh \
            uninstall.sh \
            overlay/ \
            apks/

      - name: Upload Flashable Module Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vanadium-webview-module
          path: vanadium-webview-module.zip

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${VANADIUM_VER_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists! Skipping release creation."
          else
            gh release create "$TAG_NAME" vanadium-webview-module.zip \
              --title "Vanadium WebView $VANADIUM_VER_NAME" \
              --notes-file release_notes.md
          fi

      - name: Commit and Push metadata and CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json CHANGELOG.md module.prop
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update metadata and CHANGELOG.md to $VANADIUM_VER_NAME [skip ci]"
            git push origin main
          else
            echo "No changes in update.json, CHANGELOG.md, or module.prop. Nothing to commit."
          fi
